<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{document_title}} - {{document_label}}</title>
  <style>
    @page {
      size: Letter;
      margin: 0;
    }

    :root {
      --page-width: 8.5in;
      --page-height: 11in;
      --ink: #111827;
      --muted: #5b6473;
      --soft-blue: #dff3f8;
      --soft-blue-2: #cfe8f0;
      --danger: #ff1108;
      --steel: #7d7d80;
      --paper: #ffffff;
      --border: #bcc3cf;
      --accent: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #e5e7eb;
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      padding: 24px 0;
    }

    .page {
      position: relative;
      width: var(--page-width);
      height: var(--page-height);
      margin: 0 auto;
      background: var(--paper);
      overflow: hidden;
      box-shadow: 0 16px 45px rgba(15, 23, 42, 0.15);
      border: 1px solid var(--border);
    }

    .top-border {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(17, 24, 39, 0.18);
    }

    .corner-top-left,
    .corner-top-right,
    .corner-bottom-left,
    .corner-bottom-right {
      position: absolute;
      pointer-events: none;
    }

    .corner-top-left {
      top: 0;
      left: 0;
      width: 112px;
      height: 72px;
      background: var(--soft-blue);
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }

    .corner-top-right {
      top: 0;
      right: 0;
      width: 112px;
      height: 72px;
      background: var(--soft-blue);
      clip-path: polygon(0 0, 100% 0, 100% 100%);
    }

    .corner-bottom-left {
      left: 0;
      bottom: 58px;
      width: 150px;
      height: 82px;
      background: var(--danger);
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }

    .corner-bottom-right {
      right: 0;
      bottom: 58px;
      width: 150px;
      height: 82px;
      background: var(--danger);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }

    .footer-ribbon {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      background: var(--soft-blue-2);
    }

    .footer-ribbon::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 320px;
      height: 44px;
      background: var(--steel);
      transform: translateX(-50%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .footer-grid {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 8px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-end;
      font-family: Cambria, Georgia, serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.22;
    }

    .footer-grid .left,
    .footer-grid .right {
      width: 38%;
      white-space: pre-line;
    }

    .footer-grid .right {
      text-align: right;
    }

    .header {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 150px 1fr 110px;
      align-items: start;
      padding: 8px 26px 0;
      min-height: 108px;
    }

    .logo-wrap {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .logo-wrap img {
      width: 108px;
      height: 108px;
      object-fit: contain;
      display: block;
    }

    .brand-block {
      text-align: center;
      padding-top: 8px;
    }

    .brand-name {
      margin: 0;
      font-family: Cambria, "Times New Roman", serif;
      font-size: 24px;
      font-style: italic;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .brand-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .document-area {
      position: relative;
      z-index: 2;
      padding: 0 52px 96px;
      height: calc(var(--page-height) - 108px);
    }

    .body-shell {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .watermark-cluster {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }

    .watermark-stack {
      position: relative;
      width: 250px;
      height: 220px;
      opacity: 0.26;
      transform: translateY(-6px);
    }

    .watermark-icon {
      position: absolute;
      width: 108px;
      height: 108px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .watermark-icon svg {
      width: 72px;
      height: 72px;
      fill: #ffffff;
    }

    .watermark-icon.top {
      top: 0;
      left: 71px;
      background: #fff16f;
    }

    .watermark-icon.left {
      bottom: 0;
      left: 18px;
      background: #58dfb5;
    }

    .watermark-icon.right {
      bottom: 0;
      right: 18px;
      background: #ff7a7a;
    }

    .doc-content {
      position: relative;
      z-index: 1;
      margin-top: 6px;
      transform-origin: top center;
      will-change: transform;
    }

    .doc-header-block {
      text-align: center;
      margin-bottom: 18px;
    }

    .doc-kicker {
      margin: 0 0 6px;
      color: #0f766e;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .doc-heading {
      margin: 0;
      font-family: Cambria, Georgia, serif;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #0f172a;
    }

    .doc-subheading {
      margin: 8px auto 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .doc-copy {
      margin: 16px 0;
    }

    .doc-paragraph {
      margin: 0 0 12px;
      font-size: 14px;
      line-height: 1.7;
      text-align: justify;
    }

    .doc-info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .info-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d6deea;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .info-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .info-value {
      display: block;
      font-size: 15px;
      line-height: 1.35;
      word-break: break-word;
    }

    .doc-table-block {
      margin-top: 22px;
    }

    .municipal-letter {
      min-height: 676px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .letter-date-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 2px;
    }

    .letter-date {
      font-family: Cambria, Georgia, serif;
      font-size: 16px;
      font-style: italic;
      font-weight: 700;
      text-transform: uppercase;
    }

    .letter-recipient {
      margin: 0 0 12px;
    }

    .letter-recipient-line {
      margin: 0;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 700;
    }

    .letter-body {
      display: grid;
      gap: 14px;
    }

    .letter-paragraph {
      margin: 0;
      font-size: 15px;
      line-height: 1.85;
      text-align: justify;
    }

    .letter-signature {
      margin-top: auto;
      padding-top: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .letter-signature-label {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .letter-signature-space {
      min-height: 86px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-width: 280px;
    }

    .letter-signature-name,
    .letter-signature-role {
      min-height: 20px;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
    }

    .letter-signature-image {
      display: block;
      max-width: 260px;
      max-height: 86px;
      object-fit: contain;
    }

    .letter-signature-empty {
      width: 260px;
      height: 86px;
    }

    .field-strong,
    .field-strong-inline {
      font-weight: 800;
      text-transform: uppercase;
    }

    .table-title {
      margin: 0 0 10px;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .data-table th,
    .data-table td {
      padding: 10px 12px;
      border: 1px solid #dbe4ef;
      vertical-align: top;
      text-align: left;
      font-size: 12px;
      line-height: 1.45;
      word-break: break-word;
    }

    .data-table th {
      background: #eff6ff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 11px;
    }

    code {
      padding: 1px 5px;
      border-radius: 6px;
      background: #ecfeff;
      color: #155e75;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.92em;
    }

    @media print {
      html, body {
        background: #ffffff;
      }

      body {
        padding: 0;
      }

      .page {
        margin: 0;
        box-shadow: none;
        border: 0;
      }
    }
  </style>
  <script>
    (() => {
      const READY_FLAG = "__LETTER_READY__";

      function waitForImages(scope) {
        const images = Array.from(scope.querySelectorAll("img")).filter((img) => !img.complete);
        if (!images.length) return Promise.resolve();

        return Promise.all(
          images.map(
            (img) =>
              new Promise((resolve) => {
                img.addEventListener("load", resolve, { once: true });
                img.addEventListener("error", resolve, { once: true });
              })
          )
        );
      }

      function fitContentToLetter() {
        const page = document.querySelector(".page");
        const header = document.querySelector(".header");
        const area = document.querySelector(".document-area");
        const content = document.querySelector(".doc-content");

        if (!page || !header || !area || !content) {
          window[READY_FLAG] = true;
          return;
        }

        content.style.transform = "scale(1)";
        content.style.width = "100%";

        const availableHeight = Math.max(1, area.clientHeight - 8);
        const contentHeight = Math.max(content.scrollHeight, content.offsetHeight);
        const scale = contentHeight > availableHeight
          ? Math.max(0.5, availableHeight / contentHeight)
          : 1;

        content.style.transform = `scale(${scale})`;
        content.style.width = `${100 / scale}%`;
        window[READY_FLAG] = true;
      }

      async function initLetterFit() {
        window[READY_FLAG] = false;

        if (document.fonts?.ready) {
          try {
            await document.fonts.ready;
          } catch {}
        }

        await waitForImages(document);
        fitContentToLetter();
        requestAnimationFrame(fitContentToLetter);
      }

      window.addEventListener("load", initLetterFit);
      window.addEventListener("resize", fitContentToLetter);
    })();
  </script>
</head>
<body>
  <article class="page">
    <div class="top-border"></div>
    <div class="corner-top-left"></div>
    <div class="corner-top-right"></div>
    <div class="corner-bottom-left"></div>
    <div class="corner-bottom-right"></div>

    <header class="header">
      <div class="logo-wrap">
        <img src="{{{company_logo_data_uri}}}" alt="Logo Desarrollo EG">
      </div>
      <div class="brand-block">
        <h1 class="brand-name">{{company_name}}</h1>
        <p class="brand-subtitle">{{company_subtitle}}</p>
      </div>
      <div></div>
    </header>

    <main class="document-area">
      <div class="body-shell">
        <div class="watermark-cluster" aria-hidden="true">
          <div class="watermark-stack">
            <div class="watermark-icon top">
              <svg viewBox="0 0 64 64" role="presentation">
                <path d="M14 17h36a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V21a4 4 0 0 1 4-4Zm2 4v22h32V21H16Zm10-8h12a2 2 0 0 1 2 2v4H24v-4a2 2 0 0 1 2-2Zm3 16h6v-6h6v6h6v6h-6v6h-6v-6h-6v-6Z"/>
              </svg>
            </div>
            <div class="watermark-icon left">
              <svg viewBox="0 0 64 64" role="presentation">
                <path d="M23 18a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm7 16 7 7 8-7v17H23V39l7-5Zm18-16h8v28h-8V18Zm-18 2 9 9-5 5-9-9 5-5Z"/>
              </svg>
            </div>
            <div class="watermark-icon right">
              <svg viewBox="0 0 64 64" role="presentation">
                <path d="M29 10c5 0 9 4 9 9v12c0 2-1 4-2 6l8 13H20l8-13c-1-2-2-4-2-6V19c0-5 4-9 9-9Zm-2 6h4v14h-4V16Zm-10 27c3-4 7-6 12-6s9 2 12 6c-3 5-7 8-12 8s-9-3-12-8Zm31-3c4 2 7 5 8 10-3-1-6-1-8 0 1-3 1-7 0-10Zm-1-9c5 1 8 4 9 9-3-2-6-2-9-2 1-2 1-5 0-7Zm-4 15c4 0 7 2 9 6-3-1-6 0-9 1 1-2 1-5 0-7Z"/>
              </svg>
            </div>
          </div>
        </div>

        <section class="doc-content">
          {{{body_html}}}
        </section>
      </div>
    </main>

    <div class="footer-ribbon"></div>
    <footer class="footer-grid">
      <div class="left">{{{footer_left_html}}}</div>
      <div class="right">{{{footer_right_html}}}</div>
    </footer>
  </article>
</body>
</html>
