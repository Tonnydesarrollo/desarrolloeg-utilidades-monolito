name: desarrolloeg-dev

services:
  desarrolloeg-sync-dev:
    build:
      context: ../appsheet_local_sync
      dockerfile: Dockerfile.desarrolloeg
    image: desarrolloeg-appsheet-local-sync:dev
    container_name: desarrolloeg-appsheet-local-sync-dev
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:8788:8787"
    env_file:
      - .env.dev.docker
    environment:
      DESARROLLOEG_WEBHOOK_PORT: 8787
      DESARROLLOEG_RECONCILE_INTERVAL_MINUTES: 1
      DESARROLLOEG_STATUS_PC_SYNC_INTERVAL_MINUTES: 5
      DESARROLLOEG_APP_SHELL_WEBHOOK_URL: http://monolito-dev:7001/api/app-shell/webhook
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    volumes:
      - ./data-dev:/app/data

  monolito-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_RELEASE_VERSION: 1.0.0-dev
        APP_BUILD_SHA: ${APP_BUILD_SHA:-develop}
        APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:-local}
    image: desarrolloeg-utilidades-monolito:dev
    container_name: desarrolloeg-monolito-dev
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      desarrolloeg-sync-dev:
        condition: service_healthy
    ports:
      - "127.0.0.1:7001:7001"
    env_file:
      - .env.dev.docker
    environment:
      NODE_ENV: production
      APP_ENVIRONMENT: dev
      PORT: 7001
      CLUSTER_ENABLED: 0
      CLOUDFLARED_ENABLED: 0
      PORTAL_DEV_AUTH_BYPASS: 1
      PORTAL_DEV_AUTH_NAME: Desarrollo Local
      PORTAL_DEV_AUTH_PUESTO: MEJORA CONTINUA
      PORTAL_SESSION_COOKIE_NAME: desarrolloeg_portal_session_dev
      PORTAL_GOOGLE_REDIRECT_URI: http://localhost:7001/auth/google/callback
      BOLSA_SYNC_WEBHOOK_TARGET: http://desarrolloeg-sync-dev:8787
      PUBLICIMG_PATH: /app/publicimg
      DESARROLLOEG_LOCAL_DB_PATH: /app/desarrolloeg-sync-data/desarrolloeg.sqlite
      DESARROLLOEG_SYNC_DB_PATH: /app/desarrolloeg-sync-data/desarrolloeg.sqlite
      FACTURACION_GOOGLE_CREDENTIALS_PATH: /app/secrets/facturacion/credentials.json
      FACTURACION_GOOGLE_TOKEN_PATH: /app/runtime/facturacion/token.json
      FACTURAS_NATIVE_DUMP_DIR: /app/runtime/jobs/facturas
      FACTURAS_SYNC_ENABLED: 0
      FACTURAS_SYNC_RUN_ON_START: 0
      FACTURAS_APPSHEET_SYNC_ENABLED: 0
      FACTURAS_APPSHEET_SYNC_RUN_ON_START: 0
      PEDIDOS_GOOGLE_CLIENT_CREDENTIALS: /app/secrets/pedidos/credentials.json
      PEDIDOS_GOOGLE_TOKEN_PATH: /app/runtime/pedidos/token.json
      PEDIDOS_OUTPUT_DIR: /app/runtime/jobs/pedidos
      PEDIDOS_SYNC_ENABLED: 0
      PEDIDOS_SYNC_RUN_ON_START: 0
      CASALEY_OUTPUT_DIR: /app/runtime/jobs/casaley
      CASALEY_SYNC_ENABLED: 0
      CASALEY_SYNC_RUN_ON_START: 0
      CASALEY_SYNC_ALL_ENABLED: 0
      CASALEY_SYNC_ALL_RUN_ON_START: 0
      CASALEY_EXPORT_ALL_ENABLED: 0
      CASALEY_EXPORT_ALL_RUN_ON_START: 0
      WHATSAPP_CAP_ENABLED: 0
      WHATSAPP_CAP_SESSION_DIR: /app/runtime/whatsapp-capacitadores/session
      WHATSAPP_CAP_TMP_DIR: /app/runtime/whatsapp-capacitadores/tmp
      WHATSAPP_CAP_CHROME_PATH: /usr/bin/chromium
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s
    volumes:
      - ./runtime-dev:/app/runtime
      - ./secrets:/app/secrets:ro
      - ./publicimg:/app/publicimg
      - ./data-dev:/app/desarrolloeg-sync-data
