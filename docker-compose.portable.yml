services:
  monolito:
    image: desarrolloeg-utilidades-monolito:latest
    container_name: desarrolloeg-monolito
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "7000:7000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      APP_ENVIRONMENT: prod
      PORT: 7000
      PUBLICIMG_PATH: /app/publicimg
      FACTURACION_GOOGLE_CREDENTIALS_PATH: /app/secrets/facturacion/credentials.json
      FACTURACION_GOOGLE_TOKEN_PATH: /app/runtime/facturacion/token.json
      FACTURAS_NATIVE_DUMP_DIR: /app/runtime/jobs/facturas
      DESARROLLOEG_LOCAL_DB_PATH: /app/runtime/jobs/pedidos-local.sqlite
      PEDIDOS_GOOGLE_CLIENT_CREDENTIALS: /app/secrets/pedidos/credentials.json
      PEDIDOS_GOOGLE_TOKEN_PATH: /app/runtime/pedidos/token.json
      PEDIDOS_OUTPUT_DIR: /app/runtime/jobs/pedidos
      CASALEY_OUTPUT_DIR: /app/runtime/jobs/casaley
      WHATSAPP_CAP_SESSION_DIR: /app/runtime/whatsapp-capacitadores/session
      WHATSAPP_CAP_TMP_DIR: /app/runtime/whatsapp-capacitadores/tmp
      WHATSAPP_CAP_CHROME_PATH: /usr/bin/chromium
      WHATSAPP_CAP_GOOGLE_SERVICE_ACCOUNT_JSON: /app/secrets/whatsapp/credentials.json
      WHATSAPP_CAP_GOOGLE_OAUTH_TOKEN_PATH: /app/runtime/whatsapp-capacitadores/token.json
      DESARROLLOEG_SYNC_DB_PATH: /app/desarrolloeg-sync-data/desarrolloeg.sqlite
      CLOUDFLARED_ENABLED: ${CLOUDFLARED_ENABLED:-1}
      CLOUDFLARED_BIN_PATH: /usr/local/bin/cloudflared
      CLOUDFLARED_CONFIG_PATH: /app/cloudflared/config.yml
      CLOUDFLARED_WORKDIR: /app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./runtime:/app/runtime
      - ./secrets:/app/secrets:ro
      - ../appsheet_local_sync/data:/app/desarrolloeg-sync-data

  desarrolloeg-sync:
    image: desarrolloeg-appsheet-local-sync:latest
    container_name: desarrolloeg-appsheet-local-sync
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - .env.docker
    environment:
      DESARROLLOEG_WEBHOOK_PORT: 8787
      DESARROLLOEG_RECONCILE_INTERVAL_MINUTES: ${DESARROLLOEG_RECONCILE_INTERVAL_MINUTES:-60}
      DESARROLLOEG_AUDIT_TABLE: ${DESARROLLOEG_AUDIT_TABLE:-AUDITORIA_CAMBIOS}
    volumes:
      - ../appsheet_local_sync/data:/app/data

  monolito-qa:
    profiles:
      - qa
    image: desarrolloeg-utilidades-monolito:latest
    container_name: desarrolloeg-monolito-qa
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "7001:7001"
    env_file:
      - .env.qa.docker
    environment:
      NODE_ENV: production
      APP_ENVIRONMENT: qa
      PORT: 7001
      CLUSTER_ENABLED: 0
      CLUSTER_PUBLIC_HEALTH_URL: https://qa.apps.desarrolloeg.com/health
      PORTAL_SESSION_COOKIE_NAME: desarrolloeg_portal_session_qa
      PORTAL_GOOGLE_REDIRECT_URI: https://qa.apps.desarrolloeg.com/auth/google/callback
      PUBLICIMG_PATH: /app/publicimg
      FACTURACION_GOOGLE_CREDENTIALS_PATH: /app/secrets/facturacion/credentials.json
      FACTURACION_GOOGLE_TOKEN_PATH: /app/runtime/facturacion/token.json
      FACTURAS_NATIVE_DUMP_DIR: /app/runtime/jobs/facturas
      DESARROLLOEG_LOCAL_DB_PATH: /app/runtime/jobs/pedidos-local.sqlite
      PEDIDOS_GOOGLE_CLIENT_CREDENTIALS: /app/secrets/pedidos/credentials.json
      PEDIDOS_GOOGLE_TOKEN_PATH: /app/runtime/pedidos/token.json
      PEDIDOS_OUTPUT_DIR: /app/runtime/jobs/pedidos
      CASALEY_OUTPUT_DIR: /app/runtime/jobs/casaley
      WHATSAPP_CAP_SESSION_DIR: /app/runtime/whatsapp-capacitadores/session
      WHATSAPP_CAP_TMP_DIR: /app/runtime/whatsapp-capacitadores/tmp
      WHATSAPP_CAP_CHROME_PATH: /usr/bin/chromium
      WHATSAPP_CAP_GOOGLE_SERVICE_ACCOUNT_JSON: /app/secrets/whatsapp/credentials.json
      WHATSAPP_CAP_GOOGLE_OAUTH_TOKEN_PATH: /app/runtime/whatsapp-capacitadores/token.json
      DESARROLLOEG_SYNC_DB_PATH: /app/desarrolloeg-sync-data/desarrolloeg.sqlite
      CLOUDFLARED_ENABLED: ${CLOUDFLARED_ENABLED:-1}
      CLOUDFLARED_BIN_PATH: /usr/local/bin/cloudflared
      CLOUDFLARED_CONFIG_PATH: /app/cloudflared/config.yml
      CLOUDFLARED_WORKDIR: /app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./runtime-qa:/app/runtime
      - ./secrets:/app/secrets:ro
      - ../appsheet_local_sync/data:/app/desarrolloeg-sync-data
