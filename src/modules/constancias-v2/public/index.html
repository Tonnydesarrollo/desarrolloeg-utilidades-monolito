  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
    }
    html.constancias-embedded,
    html.constancias-embedded body,
    html.constancias-embedded #root { background: transparent !important; }
    html.constancias-embedded body header,
    html.constancias-embedded body footer { display: none !important; }
    html.constancias-embedded body main {
      max-width: none !important;
      padding: 12px !important;
      background: transparent !important;
    }
    html.constancias-embedded body .min-h-screen {
      min-height: 0 !important;
      background: transparent !important;
    }
    
    /* Contenedor para PDF e Impresión Nativa - Optimizado */
    #print-capture-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 11in;
      z-index: -1000;
      pointer-events: none;
      opacity: 0;
      overflow: hidden;
      height: 1px; /* Evita scrolls innecesarios en el UI */
    }
    #print-capture-area .diploma-canvas {
      page-break-inside: avoid;
      break-inside: avoid;
    }

    @media print {
      .no-print { display: none !important; }
      #print-capture-area { 
        position: static !important;
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
        width: 11in !important;
        height: auto !important;
        z-index: 1000 !important;
      }
      body { background: white !important; }
      .page-break { page-break-after: always; display: block; clear: both; }
      @page { 
        size: letter landscape; 
        margin: 0; 
      }
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Hide capture-only overlays during PDF generation */
    .capturing .capture-hide { display: none !important; }
    /* Fit certificate to letter landscape during print/PDF */
    .capturing .diploma-canvas {
      width: 1056px !important; /* 11in @ 96dpi */
      height: 816px !important; /* 8.5in @ 96dpi */
      transform: none !important;
      transform-origin: top left !important;
    }
    .printing .diploma-canvas {
      width: 11in !important;
      height: 8.5in !important;
      transform: scale(0.92) !important;
      transform-origin: top left !important;
    }
    .printing #print-capture-area {
      padding: 0.25in !important;
      box-sizing: border-box !important;
    }
    .constancias-drive-button {
      width: 100%;
      min-height: 58px;
      border: 1px solid rgba(15, 118, 110, 0.24);
      border-radius: 2rem;
      background: linear-gradient(135deg, #0f766e, #115e59);
      color: #fff;
      box-shadow: 0 16px 34px rgba(15, 118, 110, 0.22);
      cursor: pointer;
      font: 900 0.82rem/1.25 'Inter', sans-serif;
      letter-spacing: 0.06em;
      padding: 16px 22px;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
    }
    .constancias-drive-button:hover:not(:disabled) {
      box-shadow: 0 20px 42px rgba(15, 118, 110, 0.30);
      transform: translateY(-2px);
    }
    .constancias-drive-button:disabled { cursor: wait; opacity: 0.62; }
    .constancias-drive-notice {
      position: fixed;
      z-index: 9999;
      right: 20px;
      bottom: 20px;
      display: flex;
      max-width: min(440px, calc(100vw - 40px));
      align-items: center;
      gap: 14px;
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 20px;
      padding: 15px 18px;
      color: #fff;
      background: rgba(15, 118, 110, 0.96);
      box-shadow: 0 22px 54px rgba(15, 23, 42, 0.28);
      font: 700 0.82rem/1.45 'Inter', sans-serif;
      backdrop-filter: blur(14px);
    }
    .constancias-drive-notice--error { background: rgba(153, 27, 27, 0.96); }
    .constancias-drive-notice a {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 8px 11px;
      color: inherit;
      background: rgba(255,255,255,0.16);
      font-size: 0.68rem;
      text-decoration: none;
    }
    img[alt="Logo Cliente"] {
      width: auto !important;
      height: auto !important;
      max-width: 260px !important;
      max-height: 140px !important;
      object-fit: contain !important;
    }
  </style>
