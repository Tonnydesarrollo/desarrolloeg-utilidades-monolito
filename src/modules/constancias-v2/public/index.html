  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
    }
    html.constancias-embedded,
    html.constancias-embedded body,
    html.constancias-embedded #root { background: transparent !important; }
    html.constancias-embedded body header,
    html.constancias-embedded body footer { display: none !important; }
    html.constancias-embedded body main {
      max-width: none !important;
      padding: 12px !important;
      background: transparent !important;
    }
    html.constancias-embedded body .min-h-screen {
      min-height: 0 !important;
      background: transparent !important;
    }
    
    /* Contenedor para PDF e Impresión Nativa - Optimizado */
    #print-capture-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 11in;
      z-index: -1000;
      pointer-events: none;
      opacity: 0;
      overflow: hidden;
      height: 1px; /* Evita scrolls innecesarios en el UI */
    }
    #print-capture-area .diploma-canvas {
      page-break-inside: avoid;
      break-inside: avoid;
    }

    @media print {
      .no-print { display: none !important; }
      #print-capture-area { 
        position: static !important;
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
        width: 11in !important;
        height: auto !important;
        z-index: 1000 !important;
      }
      body { background: white !important; }
      .page-break { page-break-after: always; display: block; clear: both; }
      @page { 
        size: letter landscape; 
        margin: 0; 
      }
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Hide capture-only overlays during PDF generation */
    .capturing .capture-hide { display: none !important; }
    /* Fit certificate to letter landscape during print/PDF */
    .capturing .diploma-canvas {
      width: 1056px !important; /* 11in @ 96dpi */
      height: 816px !important; /* 8.5in @ 96dpi */
      transform: none !important;
      transform-origin: top left !important;
    }
    .printing .diploma-canvas {
      width: 11in !important;
      height: 8.5in !important;
      transform: scale(0.92) !important;
      transform-origin: top left !important;
    }
    .printing #print-capture-area {
      padding: 0.25in !important;
      box-sizing: border-box !important;
    }
  </style>
