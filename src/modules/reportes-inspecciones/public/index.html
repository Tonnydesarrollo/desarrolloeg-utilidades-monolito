<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reporte de Inspecciones | Desarrollo EG</title>
  <link rel="icon" type="image/png" href="/img/Logo%20sin%20fondo%203D%20HD.png" />
  <link rel="shortcut icon" type="image/png" href="/img/Logo%20sin%20fondo%203D%20HD.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #f8fafc;
      --bg-2: #edf1f5;
      --paper: rgba(255, 255, 255, 0.95);
      --line: #d8e2ea;
      --ink: #1a2a3a;
      --muted: #667483;
      --navy: #1a2a3a;
      --crimson: #c0392b;
      --gold: #d6a43a;
      --shadow: 0 20px 48px rgba(26, 42, 58, 0.11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(192, 57, 43, 0.09), transparent 24%),
        radial-gradient(circle at top right, rgba(26, 42, 58, 0.08), transparent 22%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    }

    .shell {
      max-width: 1640px;
      margin: 0 auto;
      padding: 28px;
    }

    .hero,
    .panel,
    .preview-panel {
      border: 1px solid rgba(216, 226, 234, 0.95);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: center;
      padding: 30px 32px;
      margin-bottom: 18px;
      border-top: 4px solid var(--crimson);
      background: linear-gradient(135deg, rgba(255,255,255,0.99), rgba(245,248,251,0.96));
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--crimson);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;
      font-family: "Cinzel", serif;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.02;
      text-transform: uppercase;
    }

    .hero p {
      margin: 16px 0 0;
      max-width: 920px;
      color: var(--muted);
      line-height: 1.78;
      font-size: 0.98rem;
    }
    .hero-logo {
      width: 108px;
      height: auto;
      filter: drop-shadow(0 12px 20px rgba(26,42,58,0.16));
    }

    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      padding: 22px;
      position: sticky;
      top: 18px;
    }

    .panel-title {
      margin: 0 0 14px;
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      width: 100%;
      border: 1px solid #ccd7df;
      border-radius: 16px;
      padding: 13px 15px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--crimson);
      box-shadow: 0 0 0 4px rgba(192, 57, 43, 0.10);
      transform: translateY(-1px);
    }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
      margin-top: 4px;
    }

    .status {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .status.error { color: #b91c1c; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
      margin-bottom: 18px;
    }

    .stat {
      border: 1px solid #dae4ec;
      border-radius: 18px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,248,251,0.94));
    }

    .stat span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      min-height: 36px;
      font-size: 1rem;
      line-height: 1.3;
      word-break: break-word;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .chip,
    .empty-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 10px 12px;
      background: #fbf2d8;
      color: #7c5815;
      border: 1px solid #efdeb4;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .chip strong {
      color: var(--ink);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      margin-top: 8px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease, box-shadow 0.16s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(16, 32, 42, 0.08);
    }

    .button:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
      box-shadow: none;
    }

    .button-primary {
      background: linear-gradient(135deg, var(--navy), #304c63);
      color: #fff;
    }

    .button-ghost {
      background: #fff;
      color: var(--ink);
      border: 1px solid #d3dde5;
    }

    .preview-panel {
      min-height: 860px;
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(192,57,43,0.08), rgba(255,255,255,0.94) 38%, rgba(214,164,58,0.09));
    }

    .preview-head h2 {
      margin: 0;
      font-size: 0.96rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .preview-frame-wrap {
      padding: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.08)), #dbe4ea;
    }

    iframe {
      width: 100%;
      min-height: 820px;
      border: 1px solid #b9c6d0;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 30px rgba(16, 32, 42, 0.14);
    }

    @media (max-width: 1280px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .panel {
        position: static;
      }
    }

    @media (max-width: 860px) {
      .shell { padding: 16px; }
      .hero,
      .panel,
      .preview-panel {
        border-radius: 24px;
      }
      .stats {
        grid-template-columns: 1fr;
      }
      .hero { grid-template-columns: 1fr; }
      .hero-logo { width: 82px; }
      iframe {
        min-height: 620px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Desarrollo EG</p>
        <h1>Reporte de inspecciones</h1>
        <p>Consulta ejecutiva de hallazgos por sucursal, categoría y periodo, con evidencia fotográfica.</p>
      </div>
      <img class="hero-logo" src="/img/Logo%20sin%20fondo%203D%20HD.png" alt="Desarrollo EG">
    </section>

    <section class="layout">
      <aside class="panel">
        <h2 class="panel-title">Filtros</h2>
        <div class="field">
          <label for="search">Buscar sucursal</label>
          <input id="search" type="text" placeholder="Ejemplo: 1024, Culiacan, Centro">
        </div>
        <div class="field">
          <label for="period">Periodo</label>
          <select id="period"></select>
        </div>
        <div class="field">
          <label for="branch">Sucursal</label>
          <select id="branch"></select>
          <div class="hint">Solo aparecen sucursales con inspecciones en el periodo actual.</div>
        </div>

        <div class="status" id="loading-status">Cargando datos...</div>

        <div class="stats">
          <div class="stat"><span>Sucursales</span><strong id="stat-branches">-</strong></div>
          <div class="stat"><span>Observaciones</span><strong id="stat-observations">-</strong></div>
          <div class="stat"><span>Imágenes</span><strong id="stat-images">-</strong></div>
          <div class="stat"><span>Periodo</span><strong id="stat-period">-</strong></div>
        </div>

        <div class="chip-list" id="category-chips"></div>

        <button class="button button-primary" id="preview-btn">Previsualizar</button>
        <button class="button button-ghost" id="pdf-btn">Descargar PDF</button>
      </aside>

      <section class="preview-panel">
        <div class="preview-head">
          <h2>Vista previa</h2>
        </div>
        <div class="preview-frame-wrap">
          <iframe id="preview-frame" title="Vista previa del reporte"></iframe>
        </div>
      </section>
    </section>
  </main>

  <script>
    const state = {
      branches: [],
      filteredBranches: [],
      periodOptions: [],
      busy: false,
      previewRequestId: 0,
    };

    const routeBase = window.location.pathname.replace(/\/$/, "");
    const apiUrl = (path) => `${routeBase}/api/${path}`;

    const els = {
      search: document.getElementById("search"),
      period: document.getElementById("period"),
      branch: document.getElementById("branch"),
      loadingStatus: document.getElementById("loading-status"),
      statBranches: document.getElementById("stat-branches"),
      statObservations: document.getElementById("stat-observations"),
      statImages: document.getElementById("stat-images"),
      statPeriod: document.getElementById("stat-period"),
      categoryChips: document.getElementById("category-chips"),
      previewFrame: document.getElementById("preview-frame"),
      previewBtn: document.getElementById("preview-btn"),
      pdfBtn: document.getElementById("pdf-btn"),
    };

    function setBusy(nextBusy, message) {
      state.busy = nextBusy;
      els.previewBtn.disabled = nextBusy;
      els.pdfBtn.disabled = nextBusy;
      if (message) {
        els.loadingStatus.textContent = message;
        els.loadingStatus.classList.remove("error");
      }
    }

    function setError(message) {
      els.loadingStatus.textContent = message;
      els.loadingStatus.classList.add("error");
      setBusy(false);
    }

    function renderPeriodOptions(options) {
      els.period.innerHTML = options
        .map((option) => `<option value="${option.value}">${option.label}</option>`)
        .join("");
    }

    function renderBranchOptions(rows) {
      if (!rows.length) {
        els.branch.innerHTML = '<option value="">Sin resultados</option>';
        return;
      }

      els.branch.innerHTML = rows
        .map((row) => {
          const detail = [row.tienda, row.direccion].filter(Boolean).join(" · ");
          const extra = row.inspectionCount ? ` · ${row.inspectionCount} obs.` : "";
          return `<option value="${row.id}">${row.label}${detail ? ` · ${detail}` : ""}${extra}</option>`;
        })
        .join("");
    }

    function updateStats(summary) {
      els.statBranches.textContent = String(state.filteredBranches.length || 0);
      els.statObservations.textContent = String(summary?.inspectionCount ?? 0);
      els.statImages.textContent = String(summary?.imageCount ?? 0);
      els.statPeriod.textContent = summary?.periodLabel || "-";

      const chips = summary?.topCategories || [];
      els.categoryChips.innerHTML = chips.length
        ? chips
            .slice(0, 8)
            .map((item) => `<span class="chip">${item.label} <strong>${item.count}</strong></span>`)
            .join("")
        : '<span class="empty-chip">Sin categorías detectadas</span>';
    }

    function filterBranches() {
      const query = els.search.value.trim().toLowerCase();
      const currentId = els.branch.value;

      state.filteredBranches = !query
        ? [...state.branches]
        : state.branches.filter((row) => {
            const haystack = [row.id, row.label, row.displayLabel, row.tienda, row.direccion]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();
            return haystack.includes(query);
          });

      renderBranchOptions(state.filteredBranches);
      if (state.filteredBranches.some((row) => row.id === currentId)) {
        els.branch.value = currentId;
      } else if (state.filteredBranches[0]) {
        els.branch.value = state.filteredBranches[0].id;
      }

      els.loadingStatus.textContent = `${state.filteredBranches.length} sucursales visibles`;
      els.loadingStatus.classList.remove("error");
    }

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || `Error ${res.status}`);
      }
      return data;
    }

    function getPayload() {
      return {
        id: els.branch.value,
        period: els.period.value,
      };
    }

    async function loadDefaults() {
      const data = await fetchJson(apiUrl("defaults"));
      state.periodOptions = data.periodOptions || [];
      renderPeriodOptions(state.periodOptions);
      els.period.value = data.defaultPeriod || "last12months";
    }

    async function loadBranches() {
      const params = new URLSearchParams({ period: els.period.value });
      const data = await fetchJson(apiUrl(`sucursales?${params.toString()}`));
      state.branches = data.branches || [];
      state.filteredBranches = [...state.branches];
      renderBranchOptions(state.filteredBranches);
      if (state.filteredBranches[0]) {
        els.branch.value = state.filteredBranches[0].id;
      }
      updateStats({ ...(data.summary || {}), periodLabel: data.periodLabel });
      els.loadingStatus.textContent = `${state.branches.length} sucursales con inspecciones`;
      els.loadingStatus.classList.remove("error");
    }

    async function loadData() {
      setBusy(true, "Cargando inspecciones...");
      try {
        await loadBranches();
        filterBranches();
        if (!els.branch.value && state.filteredBranches[0]) {
          els.branch.value = state.filteredBranches[0].id;
        }
      } catch (error) {
        setError(error.message || "No se pudieron cargar los datos.");
      } finally {
        setBusy(false);
      }
    }

    async function previewDocument() {
      const requestId = ++state.previewRequestId;
      try {
        setBusy(true, "Generando vista previa...");
        const res = await fetch(apiUrl("preview"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(getPayload()),
        });

        const html = await res.text();
        if (requestId !== state.previewRequestId) return;
        if (!res.ok) {
          const data = JSON.parse(html || "{}");
          throw new Error(data.error || `Error ${res.status}`);
        }

        els.previewFrame.removeAttribute("src");
        els.previewFrame.srcdoc = html;
        els.loadingStatus.textContent = "Vista previa actualizada";
        els.loadingStatus.classList.remove("error");
      } catch (error) {
        if (requestId !== state.previewRequestId) return;
        setError(error.message || "No se pudo generar la vista previa.");
      } finally {
        if (requestId === state.previewRequestId) setBusy(false);
      }
    }

    async function downloadPdf() {
      try {
        setBusy(true, "Generando PDF...");
        const res = await fetch(apiUrl("pdf"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(getPayload()),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `Error ${res.status}`);
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const header = res.headers.get("Content-Disposition") || "";
        const match = header.match(/filename\\*=UTF-8''([^;]+)/);
        const fallback = header.match(/filename="([^"]+)"/);
        const fileName = match ? decodeURIComponent(match[1]) : (fallback ? fallback[1] : "reporte.pdf");
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        els.loadingStatus.textContent = "PDF generado correctamente";
        els.loadingStatus.classList.remove("error");
      } catch (error) {
        setError(error.message || "No se pudo generar el PDF.");
      } finally {
        setBusy(false);
      }
    }

    async function bootstrap() {
      try {
        await loadDefaults();
        await loadData();
        await previewDocument();
      } catch (error) {
        setError(error.message || "No se pudo iniciar el reporte.");
      }
    }

    els.search.addEventListener("input", filterBranches);
    els.period.addEventListener("change", async () => {
      await loadData();
      await previewDocument();
    });
    els.branch.addEventListener("change", previewDocument);
    els.previewBtn.addEventListener("click", previewDocument);
    els.pdfBtn.addEventListener("click", downloadPdf);

    bootstrap();
  </script>
</body>
</html>
