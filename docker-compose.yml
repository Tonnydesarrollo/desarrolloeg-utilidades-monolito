services:
  appsheet-sync:
    build:
      context: ../appsheet_local_sync
      dockerfile: Dockerfile
    image: desarrolloeg-appsheet-local-sync:latest
    container_name: desarrolloeg-appsheet-sync
    restart: unless-stopped
    env_file:
      - ../appsheet_local_sync/.env.local
    environment:
      WEBHOOK_PORT: 8787
      REPLICA_RECOVERY_INTERVAL_SECONDS: 300
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ../appsheet_local_sync/data:/app/data

  monolito:
    build:
      context: .
      dockerfile: Dockerfile
    image: desarrolloeg-utilidades-monolito:latest
    container_name: desarrolloeg-monolito
    restart: unless-stopped
    ports:
      - "7000:7000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 7000
      BOLSA_SYNC_WEBHOOK_TARGET: http://appsheet-sync:8787
      PUBLICIMG_PATH: /app/publicimg
      FACTURACION_GOOGLE_CREDENTIALS_PATH: /app/secrets/facturacion/credentials.json
      FACTURACION_GOOGLE_TOKEN_PATH: /app/runtime/facturacion/token.json
      FACTURAS_NATIVE_DUMP_DIR: /app/runtime/jobs/facturas
      PEDIDOS_GOOGLE_CLIENT_CREDENTIALS: /app/secrets/pedidos/credentials.json
      PEDIDOS_GOOGLE_TOKEN_PATH: /app/runtime/pedidos/token.json
      PEDIDOS_OUTPUT_DIR: /app/runtime/jobs/pedidos
      CASALEY_OUTPUT_DIR: /app/runtime/jobs/casaley
      WHATSAPP_CAP_SESSION_DIR: /app/runtime/whatsapp-capacitadores/session
      WHATSAPP_CAP_TMP_DIR: /app/runtime/whatsapp-capacitadores/tmp
      WHATSAPP_CAP_CHROME_PATH: /usr/bin/chromium
      WHATSAPP_CAP_GOOGLE_SERVICE_ACCOUNT_JSON: /app/secrets/whatsapp/credentials.json
      WHATSAPP_CAP_GOOGLE_OAUTH_TOKEN_PATH: /app/runtime/whatsapp-capacitadores/token.json
    depends_on:
      appsheet-sync:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./runtime:/app/runtime
      - ./secrets:/app/secrets:ro
      - ./publicimg:/app/publicimg
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: desarrolloeg-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
