services:
  whatsapp-prod:
    image: desarrolloeg-whatsapp:prod
    container_name: desarrolloeg-whatsapp-prod
    restart: unless-stopped
    stop_grace_period: 35s
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      APP_ENVIRONMENT: prod
      WHATSAPP_CAP_ENABLED: 1
      WHATSAPP_CAP_SERVICE_PORT: 7010
      WHATSAPP_CAP_SESSION_DIR: /app/runtime/whatsapp-capacitadores/session
      WHATSAPP_CAP_TMP_DIR: /app/runtime/whatsapp-capacitadores/tmp
      WHATSAPP_CAP_SERVICE_TOKEN_FILE: /app/runtime/whatsapp-capacitadores/service-token
      WHATSAPP_CAP_AI_CLIENT_TOKEN_FILE: /app/runtime/whatsapp-capacitadores/ai-client-token
      WHATSAPP_CAP_CHROME_PATH: /usr/bin/chromium
      WHATSAPP_CAP_GOOGLE_SERVICE_ACCOUNT_JSON: /app/secrets/whatsapp/credentials.json
      WHATSAPP_CAP_GOOGLE_OAUTH_TOKEN_PATH: /app/runtime/whatsapp-capacitadores/token.json
      DESARROLLOEG_LOCAL_DB_PATH: /app/desarrolloeg-sync-data/desarrolloeg.sqlite
      DESARROLLOEG_SYNC_DB_PATH: /app/desarrolloeg-sync-data/desarrolloeg.sqlite
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:7010/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./runtime:/app/runtime
      - ./secrets:/app/secrets:ro
      - ../data:/app/desarrolloeg-sync-data
